[package]
name = "nova"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Folding backend for data quality predicates"

[features]
default = []
hyperkzg = []

[dependencies]
dataset = { path = "../dataset" }
ff = "0.13"
nova-snark = "0.73.0"
generic-array = "1"
bincode = "1"

[[bin]]
name = "nova"
path = "src/main.rs"
